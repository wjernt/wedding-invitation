<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wedding Invitation</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      text-align: center;
      background: #fdf6f0;
      color: #333;
      padding: 50px;
    }
    .card {
      border: 2px solid #d4a373;
      padding: 30px;
      border-radius: 15px;
      background: #fff;
      display: inline-block;
    }
    h1 {
      color: #b56576;
    }
    .qr {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Tan & Gen’s Wedding</h1>
    <p>You are warmly invited to celebrate our special day.</p>
    <p><strong>Date:</strong> 20 December 2026</p>
    <p><strong>Venue:</strong> Pearl Hotel, Penang</p>
    <p><strong>Time:</strong> 6:00 PM</p>

    <div class="qr">
      <img src="qr-code.png" alt="Scan QR code for RSVP">
      <p>Scan the QR code to RSVP</p>
    </div>
  </div>
</body>
</html>
